# Hooks lancés avant chaque commit : `uvx pre-commit install` (une fois),
# puis `uvx pre-commit run --all-files` pour tout vérifier à la main.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-json
        # Les tsconfig contiennent des commentaires (JSONC), refusés par check-json.
        exclude: ^frontend/tsconfig.*\.json$

  # ruff et pyright viennent de l'environnement du back (backend/uv.lock) : une seule version.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        entry: uv run --directory backend ruff check --fix
        language: system
        files: ^backend/.*\.(py|toml)$
        pass_filenames: false
      - id: ruff-format
        name: ruff format (backend)
        entry: uv run --directory backend ruff format
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: pyright
        name: pyright (backend)
        entry: uv run --directory backend pyright
        language: system
        files: ^backend/.*\.(py|toml)$
        pass_filenames: false
      - id: eslint
        name: eslint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
      - id: prettier
        name: prettier (frontend)
        entry: npm --prefix frontend run format:check
        language: system
        files: ^frontend/
        pass_filenames: false

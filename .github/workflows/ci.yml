# Intégration continue : style, types et tests du back (x86 et ARM 64 bits, comme le Pi) et du front.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # setup-uv ne publie pas d'étiquette de version majeure : version exacte.
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          working-directory: backend
          enable-cache: true
          # Relatif à working-directory (backend/).
          cache-dependency-glob: uv.lock
      # --locked : échoue si uv.lock ne correspond plus à pyproject.toml, au lieu d'installer d'autres versions.
      - run: uv sync --locked
      # Le back et les scripts du dépôt (crochets Git), avec la configuration du back.
      - run: uv run ruff check --config pyproject.toml . ../scripts
      - run: uv run ruff format --check --config pyproject.toml . ../scripts
      - run: uv run pyright . ../scripts
      - run: uv run pytest -m "not hardware and not model and not bench"

  # Banc de la détection avec le vrai modèle YAMNet (D81, P67) : un échec bloque la fusion.
  detection:
    name: detection (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Le job tourne toujours, pour qu'un contrôle requis ait un résultat ; le banc ne tourne que si
      # la détection, le banc, le modèle, les dépendances, la version de Python ou les réglages de pytest
      # changent (toujours sur main).
      - name: Fichiers de la détection modifiés ?
        id: changes
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          pattern='^(backend/(marmotte/(detection|common)/|bench/|models/|uv\.lock|pyproject\.toml|\.python-version)|\.github/workflows/ci\.yml)'
          if [ -z "$BASE_SHA" ] || git diff --name-only "$BASE_SHA" HEAD | grep -qE "$pattern"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@v10.4.0
        with:
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock
      - if: steps.changes.outputs.run == 'true'
        run: uv sync --locked
      # Le modèle (environ 4 Mo) est gardé en cache tant que models.toml (adresse, empreinte) ne change pas.
      - if: steps.changes.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: backend/models/yamnet.tflite
          key: yamnet-${{ hashFiles('backend/models/models.toml') }}
      # Télécharge le modèle s'il manque et vérifie son empreinte SHA-256 dans tous les cas.
      - if: steps.changes.outputs.run == 'true'
        run: uv run python -c "from marmotte.detection.model_files import DEFAULT_MODELS_DIR, ensure_yamnet; ensure_yamnet(DEFAULT_MODELS_DIR)"
      - if: steps.changes.outputs.run == 'true'
        run: uv run pytest -m "model or bench"

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm ci : échoue si package-lock.json ne correspond plus à package.json.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npx vitest --run
      - run: npm run build

  hooks:
    name: hooks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Contrôles légers de pre-commit ; ruff, pyright, ESLint et Prettier tournent dans les autres jobs.
      - run: uvx pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: ruff-check,ruff-format,pyright,eslint,prettier
      - name: Tests des crochets Git
        run: uv run --directory backend pytest ../scripts
      # Le titre de la PR devient le commit de main (fusion par squash) : il suit la convention.
      # Dependabot écrit déjà au bon format, avec des titres parfois plus longs que 72 caractères.
      - name: Titre de la PR
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | python3 scripts/git_hooks/commit_message.py check -

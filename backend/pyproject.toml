[project]
name = "marmotte"
dynamic = ["version"]
description = "Babyphone vidéo fait maison, qui garde tout à la maison"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=6.0,<7",
    "django-ninja>=1.8",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "numpy>=2.5.5",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "sounddevice>=0.5.6",
]

[tool.uv]
# Same uv on the PC, the Pi and in CI (setup-uv reads this range).
required-version = ">=0.13,<0.14"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-django>=4.14",
    "ruff>=0.17",
    "pyright[nodejs]>=1.1.414",
    "pytest-env>=1.1",
    "django-stubs>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "marmotte/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["marmotte"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "marmotte.settings.dev"
# The package is installed by uv: no need to add backend/ to sys.path.
django_find_project = false
# Tests live inside each module (marmotte/<module>/tests/).
testpaths = ["marmotte"]
addopts = ["--import-mode=importlib"]
# Set by pytest-env before pytest-django loads the settings (a conftest.py would be too late),
# replacing any value from the shell. MARMOTTE_ENV_FILE empty: the local .env is never read.
env = [
    "MARMOTTE_ENV_FILE=",
    "DJANGO_SETTINGS_MODULE=marmotte.settings.dev",
    "DJANGO_SECRET_KEY=test-only-secret-key",
    "DJANGO_ALLOWED_HOSTS=testserver,localhost",
]
markers = [
    "hardware: needs the real hardware (Raspberry Pi only)",
    "model: needs the YAMNet model file",
    "bench: runs the full detection test bench",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # modern Python syntax
    "B",    # likely bugs
    "SIM",  # simplifications
    "C4",   # comprehensions
    "PTH",  # pathlib instead of os.path
    "RUF",  # ruff-specific pitfalls
    "N",    # PEP 8 naming
    "PT",   # pytest style
    "DJ",   # Django good practices
    "LOG",  # logging usage
    "ANN",  # type annotations required
    "TID",  # no relative import of a parent module
    "ERA",  # commented-out code
]

[tool.ruff.lint.isort]
# One import per line.
force-single-line = true
known-first-party = ["marmotte"]

[tool.ruff.lint.flake8-tidy-imports]
# Sibling imports (from .health import …) stay allowed; parent ones (from ..x import …) are not.
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
# Settings files are assembled with star imports (base.py, dev.py, prod.py).
"marmotte/settings/**" = ["F403", "F405"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

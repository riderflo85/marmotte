[project]
name = "marmotte"
dynamic = ["version"]
description = "Babyphone vidéo fait maison, qui garde tout à la maison"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=6.0,<7",
    "django-ninja>=1.8",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-django>=4.14",
    "ruff>=0.17",
    "pyright[nodejs]>=1.1.414",
    "pytest-env>=1.1",
    "django-stubs>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/marmotte/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/marmotte"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "marmotte.config.settings"
# The package is installed by uv: no need to add backend/ to sys.path.
django_find_project = false
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
# Set by pytest-env before pytest-django loads the settings (a conftest.py would be too late).
env = ["MARMOTTE_DEBUG=1"]
markers = [
    "hardware: needs the real hardware (Raspberry Pi only)",
    "model: needs the YAMNet model file",
    "bench: runs the full detection test bench",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
